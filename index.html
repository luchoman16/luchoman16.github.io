<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Regalo Especial</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #f9f4e8;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #d70000;
            padding: 20px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            color: white;
            font-size: 2.5em;
        }
        .snoopy-image {
            margin-top: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
        }
        .snoopy-image img {
            z-index: 2;
            position: absolute;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }
        #heart-container {
            position: absolute;
            top: 60%; /* Moved down */
            left: 70%; /* Moved right */
            transform: translate(-50%, -50%);
            width: 500px; /* Increased size */
            height: 500px; /* Increased size */
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        .snoopy {
            position: absolute;
            width: 50px;
            height: 50px;
            background-image: url('https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png');
            background-size: cover;
            pointer-events: none;
            opacity: 0;
            animation: moveSnoopy 1s forwards;
        }
        @keyframes moveSnoopy {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .message {
            margin: 20px auto;
            padding: 20px;
            max-width: 600px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        .message p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #555;
        }
        .interactive {
            margin: 30px 0;
        }
        .footer {
            margin-top: 30px;
            padding: 10px;
            background-color: #d70000;
            box-shadow: 0px -4px 6px rgba(0, 0, 0, 0.1);
        }
        .footer p {
            font-size: 0.9em;
            color: white;
        }
        @media (max-width: 768px) {
            .message {
                padding: 15px;
                font-size: 1em;
            }
            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Un Regalo Especial</h1>
    </header>

    <div class="snoopy-image">
        <div id="heart-container">
            <!-- The hearts will appear here -->
        </div>
        <img id="central-snoopy" src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png" alt="Snoopy" width="300">
    </div>

    <div class="message">
        <p>Marlett care Poto,</p>
        <p>
            Quise hacer algo especial para ti, porque jodes y jodes y te gusta: ¡Snoopy! 🐶
        </p>
        <p>
            Espero que te saque una sonrisa pi, porque toda la tarde hize esto. ❤️
        </p>
    </div>

    <div class="interactive">
        <h2>Haz clic en el corazón:</h2>
        <button id="heart-button" style="font-size: 1.5em; padding: 10px 20px; border: none; background-color: #d70000; color: white; border-radius: 5px; cursor: pointer;">❤️</button>
    </div>

    <div class="footer">
        <p>La Sirenita.</p>
    </div>

    <audio autoplay loop>
        <source src="quiero_perderme_contigo.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <script>
        const heartButton = document.getElementById('heart-button');
        const heartContainer = document.getElementById('heart-container');
        const centralSnoopy = document.getElementById('central-snoopy');

        heartButton.addEventListener('click', () => {
            // Hide the central Snoopy
            centralSnoopy.style.opacity = '0';
            setTimeout(() => {
                centralSnoopy.style.display = 'none';
            }, 500);

            // Clear previous heart coordinates if any
            heartContainer.innerHTML = '';

            // Generate heart shape coordinates
            const hearts = [];
            const size = 200; // Adjust size of the heart
            for (let angle = 0; angle < 360; angle += 10) {
                const radians = (Math.PI / 180) * angle;
                const x = 16 * Math.sin(radians) ** 3;
                const y = 13 * Math.cos(radians) - 5 * Math.cos(2 * radians) - 2 * Math.cos(3 * radians) - Math.cos(4 * radians);
                hearts.push({ x: size / 2 + x * size / 30, y: size / 2 - y * size / 30 });
            }

            // Create Snoopys in a heart shape with animation
            hearts.forEach((coord, index) => {
                const snoopy = document.createElement('div');
                snoopy.classList.add('snoopy');
                snoopy.style.left = `${coord.x}px`;
                snoopy.style.top = `${coord.y}px`;
                snoopy.style.animationDelay = `${index * 0.1}s`; // Stagger the animation
                heartContainer.appendChild(snoopy);
            });
        });
    </script>
</body>
</html>
